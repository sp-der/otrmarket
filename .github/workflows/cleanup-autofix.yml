name: Cleanup autofix

on:
  push:
    branches:
      - chore/pre-replay-repo-cleanup

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pre-replay-repo-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove inactive Coinbase runtime path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.py')
          text = path.read_text()
          replacements = {
              'import json\n': '',
              'import websockets\n': '',
              '    save_quote,\n': '',
              'COINBASE_URL = "wss://advanced-trade-ws.coinbase.com"\n': '',
              '    "Coinbase": "DISABLED",\n': '',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
          start = text.find('\nasync def coinbase_collector(connection):')
          end = text.find('\n\ndef _latest_ninjatrader_id(connection)', start)
          if start != -1:
              if end == -1:
                  raise SystemExit('Could not find end of legacy Coinbase collector block')
              text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Static dead-symbol audit
        run: |
          python -m pip install --quiet ruff vulture
          ruff check src scripts --select E9,F401,F811,F821,F841 --fix
          echo '--- Vulture high-confidence audit ---'
          vulture src scripts --min-confidence 100 || true
      - name: Commit cleanup fixes
        run: |
          if git diff --quiet; then
            echo "No cleanup changes remaining."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Remove inactive Coinbase runtime path"
          git push origin HEAD:chore/pre-replay-repo-cleanup
