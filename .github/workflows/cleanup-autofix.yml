name: Cleanup autofix

on:
  push:
    branches:
      - chore/pre-replay-repo-cleanup

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pre-replay-repo-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove safe unused imports
        run: |
          python -m pip install --quiet ruff
          ruff check src scripts --select F401 --fix
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe autofixes remaining."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Remove remaining unused imports"
          git push origin HEAD:chore/pre-replay-repo-cleanup
