name: OTR regression tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Dependency integrity
        run: python -m pip check

      - name: Reject generated repository artifacts
        shell: bash
        run: |
          bad="$(git ls-files | grep -E '(^|/)(__pycache__/|\.pytest_cache/|\.ruff_cache/)|\.(pyc|pyo|log|db|sqlite|sqlite3|bak|tmp)$' || true)"
          if [ -n "$bad" ]; then
            echo "Generated/runtime artifacts must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Static hygiene
        run: ruff check src scripts tests --select E9,F401,F811,F821,F841

      - name: Compile Python
        run: python -m compileall -q src scripts tests

      - name: Validate shell launchers
        run: bash -n run_all.sh run_dashboard.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v

  nautilus-shadow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OTR and pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-nautilus.txt
          python -m pip check

      - name: Probe Nautilus shadow runtime
        env:
          OTR_NAUTILUS_SHADOW: "1"
        run: python scripts/probe_nautilus_shadow.py

      - name: Run synthetic MGC replay through Nautilus
        run: python scripts/smoke_nautilus_gc_replay.py

      - name: Run synthetic MGC bracket through Nautilus
        run: python scripts/smoke_nautilus_execution_parity.py

      - name: Run end-to-end Gold parity ledger smoke
        run: python scripts/smoke_nautilus_parity_ledger.py
