name: OTR regression tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Static hygiene
        run: ruff check src scripts --select E9,F401,F811,F821,F841

      - name: Compile source
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m unittest discover -s tests -v

  nautilus-shadow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OTR and pinned NautilusTrader
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-nautilus.txt

      - name: Probe Nautilus shadow runtime
        env:
          OTR_NAUTILUS_SHADOW: "1"
        run: python scripts/probe_nautilus_shadow.py

      - name: Run synthetic MGC replay through Nautilus
        run: python scripts/smoke_nautilus_gc_replay.py

      - name: Run synthetic MGC bracket through Nautilus
        run: python scripts/smoke_nautilus_execution_parity.py

      - name: Run end-to-end Gold parity ledger smoke
        run: python scripts/smoke_nautilus_parity_ledger.py
